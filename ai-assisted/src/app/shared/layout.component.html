<div class="app-shell">
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark">OP</div>
      <div>
        <h3>OpsPilot</h3>
        <p class="subtitle">Multi-Tenant Work Platform</p>
      </div>
    </div>

    <!-- Active Workspace Selector -->
    <div class="workspace-pill" *ngIf="activeTenant">
      <span class="badge">Workspace</span>
      <span class="org-name">{{ activeTenant.name || activeTenant.slug || 'Default' }}</span>
      <button class="switch-btn" (click)="switchWorkspace()" title="Create or Switch Workspace">+</button>
    </div>

    <nav class="top-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Dashboard</a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-link">Projects</a>
      <a routerLink="/tickets" routerLinkActive="active" class="nav-link">Tickets</a>
      <a routerLink="/kanban" routerLinkActive="active" class="nav-link">Kanban Board</a>
      <a routerLink="/members" routerLinkActive="active" class="nav-link">Members</a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-link">Settings</a>
      <a href="#" (click)="logout($event)" class="nav-link logout-link">Sign Out</a>
    </nav>
  </header>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>© 2026 OpsPilot SaaS Platform. Multi-Tenant Work & Client Support Management.</p>
  </footer>
</div>
