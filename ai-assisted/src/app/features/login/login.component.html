<section class="auth-shell">
  <div class="auth-card">
    <div class="brand-panel">
      <p class="eyebrow">AI ASSISTED</p>
      <h1>Welcome back</h1>
      <p>Sign in to continue with your intelligent workspace.</p>
      <ul>
        <li>Mocked secure sign-in</li>
        <li>Fast, polished experience</li>
        <li>Ready for your next flow</li>
      </ul>
    </div>

    <div class="form-panel">
      <h2>Login</h2>
      <p class="hint">Use demo&#64;ai.dev / password123</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-control" formControlName="email" type="email" placeholder="demo@ai.dev" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-control" formControlName="password" type="password" placeholder="••••••••" />
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid">Sign in</button>

        <div class="register-prompt">
          <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
        </div>
      </form>
    </div>
  </div>
</section>
